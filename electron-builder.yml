appId: com.deplox.app
productName: Deplox
directories:
  buildResources: resources
  output: release/${version}
files:
  - out/**
  - package.json
asarUnpack:
  - '**/node_modules/node-pty/**'
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  # Ad-hoc signature until there is a Developer ID: Apple Silicon refuses unsigned apps as "damaged".
  identity: '-'
  # Hardened runtime only matters for notarization, and with an ad-hoc identity it blocks loading node-pty.
  hardenedRuntime: false
  target: [dmg, zip]
win:
  target: [nsis]
linux:
  target: [AppImage, deb]
  category: Development
  # .deb needs a maintainer with an email.
  maintainer: Akmal <akmalyasykur@gmail.com>
